[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-scanner"
version = "1.0.0"
description = "A lightweight, modular TCP port scanner built in Python for learning network programming and concurrent scanning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Rohit Dinde", email = "dinde.infosec@gmail.com" }
]
keywords = [
    "python",
    "network",
    "tcp",
    "scanner",
    "port-scanner",
    "cybersecurity",
    "security",
    "socket",
    "cli",
    "networking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Rohit30Confluence/mini-scanner"
Repository = "https://github.com/Rohit30Confluence/mini-scanner"
Issues = "https://github.com/Rohit30Confluence/mini-scanner/issues"

[project.scripts]
mini-scanner = "mini_scanner.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mini_scanner*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["mini_scanner"]

[tool.coverage.report]
show_missing = true
skip_covered = false