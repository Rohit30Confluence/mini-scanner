[tox]
minversion = 4.0
envlist = py311, py312, py313
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the test suite
deps =
    pytest
    pytest-cov
commands =
    pytest -v --cov=mini_scanner --cov-report=term-missing

[testenv:lint]
description = Run static analysis and formatting checks
deps =
    black
    isort
    ruff
commands =
    black --check .
    isort --check-only .
    ruff check .

[testenv:format]
description = Format source code
deps =
    black
    isort
    ruff
commands =
    black .
    isort .
    ruff format .

[testenv:type]
description = Run type checking
deps =
    mypy
commands =
    mypy mini_scanner

[testenv:security]
description = Run security audit
deps =
    pip-audit
commands =
    pip-audit

[testenv:docs]
description = Build documentation
deps =
    mkdocs
    mkdocs-material
commands =
    mkdocs build --strict

[testenv:clean]
description = Remove build artifacts
allowlist_externals =
    python
commands =
    python -c "import shutil, pathlib; [shutil.rmtree(p, ignore_errors=True) for p in ['build','dist','.pytest_cache','.mypy_cache','.ruff_cache','htmlcov','.tox']]"

[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --strict-config

[coverage:run]
source = mini_scanner
branch = true

[coverage:report]
show_missing = true
skip_covered = true

[isort]
profile = black

[flake8]
max-line-length = 88
extend-ignore = E203,W503

[mypy]
python_version = 3.13
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true