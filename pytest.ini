[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=mini_scanner
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html

filterwarnings =
    error

markers =
    integration: Integration tests
    slow: Slow-running tests