name: Stale Issues and Pull Requests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 60
          days-before-close: 14

          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            had no recent activity. If there is still work to do, please leave
            a comment to keep it open.

          close-issue-message: >
            This issue has been automatically closed due to inactivity.

          stale-pr-message: >
            This pull request has been marked as stale because it has had no
            recent activity. Please update it if it is still relevant.

          close-pr-message: >
            This pull request has been automatically closed due to inactivity.

          stale-issue-label: stale
          stale-pr-label: stale

          exempt-issue-labels: >
            pinned,security,bug,enhancement

          exempt-pr-labels: >
            pinned,security

          remove-stale-when-updated: true

          operations-per-run: 100