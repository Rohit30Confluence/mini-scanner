site_name: mini-scanner
site_description: Lightweight Python TCP Port Scanner
site_author: Rohit Dinde
site_url: https://rohit30confluence.github.io/mini-scanner/

repo_name: Rohit30Confluence/mini-scanner
repo_url: https://github.com/Rohit30Confluence/mini-scanner

copyright: Copyright © 2026 Rohit Dinde

theme:
  name: material

  language: en

  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Examples: examples.md
  - API Reference: api.md
  - Development: development.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md

docs_dir: docs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rohit30Confluence

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rohitdinde/

    - icon: fontawesome/brands/x-twitter
      link: https://x.com/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

strict: true